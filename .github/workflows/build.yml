name: Build
on: [push, workflow_dispatch]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxrandr-dev libxcursor-dev libxi-dev libudev-dev \
            libfreetype-dev libflac-dev libvorbis-dev libopenal-dev \
            libgl1-mesa-dev libegl1-mesa-dev

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Package
        shell: bash
        run: |
          mkdir dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp -r build/Release/. dist/
          else
            cp build/game dist/ && cp -r assets dist/
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: snake-${{ matrix.os }}
          path: dist